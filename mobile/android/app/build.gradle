apply plugin: 'com.android.application'

// «مركز الاتصال المؤسسي» on Android (Android_Build_Plan.md; MVP_draft.md 64). The version is the one in
// mobile/package.json, and Android's whole number grows with it.
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def parts = pkg.version.tokenize('.').collect { it as int }
def productionOrigin = 'https://comms-hub-three.vercel.app'
// The local site seen from the phone through adb reverse: a loopback address, so the page is a secure context.
def localOrigin = 'http://127.0.0.1:3000'
// The application's own releases (A3): the public bucket of the comms-hub project, as src/lib/native/releases.ts
// names it; the check package reads a feed the update check serves on this computer.
def productionFeed = 'https://hrghmioxvgkjpnydrxrk.supabase.co/storage/v1/object/public/android-releases/android'
def checkFeed = 'http://127.0.0.1:3002/android'

// The owner's release key: a properties file outside the repository, named by an environment variable
// (mobile/README.md). No agent and no file of this repository holds it. Without it a release is unsigned.
def keyProps = new Properties()
def keyFile = System.getenv('COMMSHUB_KEYSTORE_PROPERTIES')
if (keyFile && new File(keyFile).exists()) new File(keyFile).withInputStream { keyProps.load(it) }

android {
    namespace = "sa.commshub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "sa.commshub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The compiled address list of a release: the production address alone.
        buildConfigField "String", "ALLOWED_ORIGINS", "\"${productionOrigin}\""
        buildConfigField "String", "UPDATE_FEED", "\"${productionFeed}\""
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (keyProps['storeFile']) {
            owner {
                storeFile new File(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    flavorDimensions = ['channel']
    productFlavors {
        // The APK from «الحساب», until Google Play (A3 adds its own updates).
        direct {
            dimension 'channel'
            buildConfigField 'String', 'CHANNEL', '"direct"'
        }
        // Google Play (A8): the same key, Play's own updates.
        play {
            dimension 'channel'
            buildConfigField 'String', 'CHANNEL', '"play"'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            buildConfigField "String", "ALLOWED_ORIGINS", "\"${productionOrigin},${localOrigin}\""
        }
        // The check package (qa/android-*.cjs): its own id, so a check never touches a real installation.
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            matchingFallbacks = ['debug']
            buildConfigField "String", "UPDATE_FEED", "\"${checkFeed}\""
            buildConfigField "String", "ALLOWED_ORIGINS", "\"${productionOrigin},${localOrigin}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keyProps['storeFile']) signingConfig signingConfigs.owner
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// The update check (qa/android-update.cjs) builds the check package at two versions, -PcheckVersion=x.y.z,
// without touching package.json. Only the check package takes it.
androidComponents {
    onVariants(selector().withBuildType('qa')) { variant ->
        if (project.hasProperty('checkVersion')) {
            def v = project.property('checkVersion').toString()
            def p = v.tokenize('.').collect { it as int }
            variant.outputs.each { output ->
                output.versionName.set(v)
                output.versionCode.set(p[0] * 10000 + p[1] * 100 + p[2])
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
