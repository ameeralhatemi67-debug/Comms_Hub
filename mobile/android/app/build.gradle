apply plugin: 'com.android.application'

// «مركز الاتصال المؤسسي» on Android (Android_Build_Plan.md; MVP_draft.md 64). The version is the one in
// mobile/package.json, and Android's whole number grows with it.
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def parts = pkg.version.tokenize('.').collect { it as int }
def productionOrigin = 'https://comms-hub-three.vercel.app'
// The local site seen from the phone through adb reverse: a loopback address, so the page is a secure context.
def localOrigin = 'http://127.0.0.1:3000'
// The application's own releases (A3): the public bucket of the comms-hub project, as src/lib/native/releases.ts
// names it; the check package reads a feed the update check serves on this computer.
def productionFeed = 'https://hrghmioxvgkjpnydrxrk.supabase.co/storage/v1/object/public/android-releases/android'
def checkFeed = 'http://127.0.0.1:3002/android'

// The owner's release key: a properties file outside the repository, named by an environment variable
// (mobile/README.md). No agent and no file of this repository holds it. Without it a release is unsigned.
def keyProps = new Properties()
def keyFile = System.getenv('COMMSHUB_KEYSTORE_PROPERTIES')
if (keyFile && new File(keyFile).exists()) new File(keyFile).withInputStream { keyProps.load(it) }

// The owner's Firebase project for push (A5): google-services.json kept outside the repository and named by
// COMMSHUB_GOOGLE_SERVICES (mobile/README.md). Only the four public identifiers of the client whose package is the
// build's own id are compiled in (ShellApp.java starts Firebase with them); without the file or that client, the
// build has no push. No Google services plugin and no Firebase file in the repository.
def services = null
def servicesFile = System.getenv('COMMSHUB_GOOGLE_SERVICES')
if (servicesFile && new File(servicesFile).exists()) services = new groovy.json.JsonSlurper().parse(new File(servicesFile))
def plain = { v -> v != null && (v.toString() ==~ /[A-Za-z0-9:._-]{1,200}/) ? v.toString() : '' }
def firebaseFor = { String appId ->
    def client = services?.client?.find { it?.client_info?.android_client_info?.package_name == appId }
    def ids = [
        FIREBASE_APP_ID: plain(client?.client_info?.mobilesdk_app_id),
        FIREBASE_API_KEY: plain(client?.api_key?.find { it?.current_key }?.current_key),
        FIREBASE_PROJECT_ID: plain(client ? services?.project_info?.project_id : null),
        FIREBASE_SENDER_ID: plain(client ? services?.project_info?.project_number : null),
    ]
    ids.values().any { it.isEmpty() } ? ids.collectEntries { k, v -> [k, ''] } : ids
}
def firebaseFields = { target, String appId ->
    firebaseFor(appId).each { k, v -> target.buildConfigField 'String', k, "\"${v}\"" }
}

android {
    namespace = "sa.commshub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "sa.commshub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The compiled address list of a release: the production address alone.
        buildConfigField "String", "ALLOWED_ORIGINS", "\"${productionOrigin}\""
        buildConfigField "String", "UPDATE_FEED", "\"${productionFeed}\""
        firebaseFields(delegate, 'sa.commshub.app')
        // The site whose links open the application (A6), and how long away before the lock asks again (five minutes).
        buildConfigField "String", "LINK_SITE", "\"${productionOrigin}\""
        buildConfigField "long", "LOCK_AFTER_MS", "300000L"
        // Where a background upload may send a file (A7): Google Drive's upload address only.
        buildConfigField "String", "UPLOAD_PREFIXES", "\"https://www.googleapis.com/upload/drive/\""
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (keyProps['storeFile']) {
            owner {
                storeFile new File(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    flavorDimensions = ['channel']
    productFlavors {
        // The APK from «الحساب», until Google Play (A3 adds its own updates).
        direct {
            dimension 'channel'
            buildConfigField 'String', 'CHANNEL', '"direct"'
        }
        // Google Play (A8): the same key, Play's own updates.
        play {
            dimension 'channel'
            buildConfigField 'String', 'CHANNEL', '"play"'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            buildConfigField "String", "ALLOWED_ORIGINS", "\"${productionOrigin},${localOrigin}\""
            firebaseFields(delegate, 'sa.commshub.app.dev')
        }
        // The check package (qa/android-*.cjs): its own id, so a check never touches a real installation.
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            matchingFallbacks = ['debug']
            buildConfigField "String", "UPDATE_FEED", "\"${checkFeed}\""
            buildConfigField "String", "ALLOWED_ORIGINS", "\"${productionOrigin},${localOrigin}\""
            firebaseFields(delegate, 'sa.commshub.app.qa')
            // Five seconds, so the check need not wait five minutes for the lock.
            buildConfigField "long", "LOCK_AFTER_MS", "5000L"
            // And the check's own stand-in of Drive's resumable protocol (qa/android-upload.cjs).
            buildConfigField "String", "UPLOAD_PREFIXES", "\"https://www.googleapis.com/upload/drive/,http://127.0.0.1:3004/upload/\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keyProps['storeFile']) signingConfig signingConfigs.owner
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// The update check (qa/android-update.cjs) builds the check package at two versions, -PcheckVersion=x.y.z,
// without touching package.json. Only the check package takes it.
androidComponents {
    onVariants(selector().withBuildType('qa')) { variant ->
        if (project.hasProperty('checkVersion')) {
            def v = project.property('checkVersion').toString()
            def p = v.tokenize('.').collect { it as int }
            variant.outputs.each { output ->
                output.versionName.set(v)
                output.versionCode.set(p[0] * 10000 + p[1] * 100 + p[2])
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
